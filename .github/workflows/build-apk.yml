
name: Build Custom Board APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CustomBoard_AndroidStudio_Project_v2.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q CustomBoard_AndroidStudio_Project_v2.zip -d extracted
          test -f extracted/CustomBoard/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/CustomBoard
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomBoard-debug-APK
          path: extracted/CustomBoard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
